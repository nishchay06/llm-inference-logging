<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chatbot — inference logging</title>
  <style>
    :root { --bd: #d8dde3; --muted: #6b7280; --accent: #2563eb; --bg: #f7f8fa; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, -apple-system, sans-serif; color: #111; background: var(--bg); }
    #app { display: grid; grid-template-columns: 280px 1fr; height: 100vh; }

    /* sidebar */
    #sidebar { border-right: 1px solid var(--bd); background: #fff; display: flex; flex-direction: column; min-height: 0; }
    #sidebar header { padding: 14px 16px; border-bottom: 1px solid var(--bd); display: flex; align-items: center; justify-content: space-between; }
    #sidebar header h2 { margin: 0; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    #new-chat { border: 1px solid var(--bd); background: #fff; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
    #new-chat:hover { background: var(--bg); }
    #conversations { list-style: none; margin: 0; padding: 6px; overflow-y: auto; flex: 1; }
    #conversations li { padding: 9px 10px; border-radius: 6px; cursor: pointer; }
    #conversations li:hover { background: var(--bg); }
    #conversations li.active { background: #eef2ff; }
    .conv-preview { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-meta { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
    #conversations .empty { color: var(--muted); padding: 10px; font-size: 13px; }

    /* chat */
    #chat { display: flex; flex-direction: column; min-height: 0; }
    #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 70%; padding: 9px 13px; border-radius: 12px; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 3px; white-space: pre-wrap; }
    .msg.assistant { align-self: flex-start; background: #fff; border: 1px solid var(--bd); border-bottom-left-radius: 3px; }
    /* markdown rendered inside assistant bubbles */
    .msg.assistant > *:first-child { margin-top: 0; }
    .msg.assistant > *:last-child { margin-bottom: 0; }
    .msg.assistant p { margin: 0 0 8px; }
    .msg.assistant ul, .msg.assistant ol { margin: 0 0 8px; padding-left: 22px; }
    .msg.assistant pre { background: #f3f4f6; border: 1px solid var(--bd); border-radius: 6px; padding: 10px; overflow-x: auto; margin: 0 0 8px; }
    .msg.assistant code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
    .msg.assistant :not(pre) > code { background: #f3f4f6; padding: 1px 5px; border-radius: 4px; }
    .msg.assistant table { border-collapse: collapse; margin: 0 0 8px; }
    .msg.assistant th, .msg.assistant td { border: 1px solid var(--bd); padding: 4px 8px; }
    .msg.assistant a { color: var(--accent); }

    /* typing indicator */
    .msg.typing { display: flex; gap: 4px; align-items: center; padding: 12px 14px; }
    .msg.typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); opacity: .4; animation: blink 1.4s infinite both; }
    .msg.typing span:nth-child(2) { animation-delay: .2s; }
    .msg.typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .3; } 40% { opacity: 1; } }
    #placeholder { margin: auto; color: var(--muted); }
    #composer { display: flex; gap: 8px; padding: 14px; border-top: 1px solid var(--bd); background: #fff; }
    #provider { padding: 10px 8px; border: 1px solid var(--bd); border-radius: 8px; font: inherit; background: #fff; cursor: pointer; }
    #input { flex: 1; padding: 10px 12px; border: 1px solid var(--bd); border-radius: 8px; font: inherit; }
    #send { padding: 10px 18px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; font: inherit; min-width: 76px; }
    #send:disabled { opacity: .5; cursor: default; }
    #send.cancel { background: #dc2626; }
  </style>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <header>
        <h2>Conversations</h2>
        <button id="new-chat">+ New</button>
      </header>
      <ul id="conversations"><li class="empty">Loading…</li></ul>
    </aside>

    <main id="chat">
      <div id="messages"><div id="placeholder">Start a new conversation, or pick one on the left.</div></div>
      <form id="composer">
        <select id="provider" title="Model provider"></select>
        <input id="input" placeholder="Type a message…" autocomplete="off" autofocus />
        <button id="send" type="submit">Send</button>
      </form>
    </main>
  </div>

  <script src="/static/marked.min.js"></script>
  <script>
    // Plain fetch-based client over the three endpoints. No framework, on
    // purpose — every layer stays visible (see LEARNING_PLAN.md).
    let sessionId = null;

    const $messages = document.getElementById("messages");
    const $convList = document.getElementById("conversations");
    const $input = document.getElementById("input");
    const $send = document.getElementById("send");
    const $provider = document.getElementById("provider");

    async function loadProviders() {
      const data = await (await fetch("/providers")).json();
      $provider.innerHTML = "";
      for (const p of data.providers) {
        const opt = document.createElement("option");
        opt.value = p.name;
        opt.textContent = p.name + " (" + p.model + ")";
        if (p.name === data.default) opt.selected = true;
        $provider.appendChild(opt);
      }
      // Nothing to switch if there's only one provider.
      $provider.style.display = data.providers.length > 1 ? "" : "none";
    }

    function addMessage(role, content) {
      document.getElementById("placeholder")?.remove();
      const el = document.createElement("div");
      el.className = "msg " + role;
      // Assistant replies are markdown; render them. (marked does not
      // sanitize — fine here since the content is our own model's output;
      // production would run it through a sanitizer like DOMPurify.)
      if (role === "assistant" && window.marked) {
        el.innerHTML = marked.parse(content);
      } else {
        el.textContent = content;
      }
      $messages.appendChild(el);
      $messages.scrollTop = $messages.scrollHeight;
      return el;
    }

    function showTyping() {
      document.getElementById("placeholder")?.remove();
      const el = document.createElement("div");
      el.className = "msg assistant typing";
      el.innerHTML = "<span></span><span></span><span></span>";
      $messages.appendChild(el);
      $messages.scrollTop = $messages.scrollHeight;
      return el;
    }

    function clearMessages(placeholder) {
      $messages.innerHTML = "";
      if (placeholder) {
        const p = document.createElement("div");
        p.id = "placeholder";
        p.textContent = placeholder;
        $messages.appendChild(p);
      }
    }

    async function loadConversations() {
      const rows = await (await fetch("/conversations")).json();
      $convList.innerHTML = "";
      if (rows.length === 0) {
        $convList.innerHTML = '<li class="empty">No conversations yet.</li>';
        return;
      }
      for (const c of rows) {
        const li = document.createElement("li");
        li.dataset.sessionId = c.session_id;
        if (c.session_id === sessionId) li.className = "active";
        li.innerHTML =
          '<span class="conv-preview"></span>' +
          '<span class="conv-meta">' + c.message_count + " messages</span>";
        li.querySelector(".conv-preview").textContent = c.preview || "(empty)";
        li.onclick = () => resumeConversation(c.session_id);
        $convList.appendChild(li);
      }
    }

    async function resumeConversation(id) {
      const conv = await (await fetch("/conversations/" + id)).json();
      sessionId = id;
      clearMessages(null);
      for (const m of conv.messages) addMessage(m.role, m.content);
      loadConversations(); // refresh active highlight
    }

    function newChat() {
      sessionId = null;
      clearMessages("New conversation — say hello.");
      loadConversations();
      $input.focus();
    }

    function renderAssistant(el, text) {
      if (window.marked) el.innerHTML = marked.parse(text);
      else el.textContent = text;
    }

    let abortCtrl = null; // set while a stream is in flight (button acts as Cancel)

    function setStreaming(on) {
      $send.textContent = on ? "Cancel" : "Send";
      $send.classList.toggle("cancel", on);
    }

    // Stream the reply over SSE, appending deltas into the assistant bubble live.
    async function sendMessage(text) {
      addMessage("user", text);
      const typing = showTyping();
      abortCtrl = new AbortController();
      setStreaming(true);

      let bubble = null;
      let acc = "";
      const ensureBubble = () => {
        if (!bubble) { typing.remove(); bubble = addMessage("assistant", ""); }
        return bubble;
      };

      try {
        const resp = await fetch("/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: text,
            session_id: sessionId,
            provider: $provider.value || null,
          }),
          signal: abortCtrl.signal,
        });
        if (!resp.ok) throw new Error("HTTP " + resp.status);

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          let i;
          while ((i = buffer.indexOf("\n\n")) !== -1) {
            const frame = buffer.slice(0, i).trim();
            buffer = buffer.slice(i + 2);
            if (!frame.startsWith("data:")) continue;
            const evt = JSON.parse(frame.slice(5).trim());
            if (evt.type === "start") {
              sessionId = evt.session_id; // adopt the id the server assigned
            } else if (evt.type === "delta") {
              acc += evt.text;
              renderAssistant(ensureBubble(), acc);
              $messages.scrollTop = $messages.scrollHeight;
            } else if (evt.type === "error") {
              ensureBubble().textContent = "[error: " + evt.message + "]";
            }
            // "done" — the stream ends on its own; nothing to do
          }
        }
      } catch (e) {
        if (e.name === "AbortError") {
          if (bubble && acc) renderAssistant(bubble, acc + " ⏹"); // cancelled — keep partial
        } else {
          ensureBubble().textContent = "[error contacting server]";
        }
      } finally {
        typing.remove();
        abortCtrl = null;
        setStreaming(false);
        loadConversations(); // new/updated conversation floats to the top
        $input.focus();
      }
    }

    document.getElementById("composer").addEventListener("submit", (e) => {
      e.preventDefault();
      if (abortCtrl) { abortCtrl.abort(); return; } // button is "Cancel" mid-stream
      const text = $input.value.trim();
      if (!text) return;
      $input.value = "";
      sendMessage(text);
    });
    document.getElementById("new-chat").addEventListener("click", newChat);

    loadProviders();
    loadConversations();
  </script>
</body>
</html>
