# One-command local stack: Postgres + Redis + chatbot + ingestion API + a
# broker worker.
#
#   docker compose up --build
#
# Reads ANTHROPIC_API_KEY from a .env file next to this one (compose picks it
# up automatically for ${...} interpolation). Then open http://localhost:8000
# (chat) and http://localhost:8001/dashboard (observability).
#
# Log path here is event-based: the chatbot publishes to a Redis Stream and the
# `worker` consumes it into Postgres (durable across an ingestion outage).

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot
      POSTGRES_DB: chatbot
    ports:
      - "5432:5432" # exposed so you can psql from the host if you want
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot -d chatbot"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  # One-shot: create the schema once, then exit. Both app services wait for it
  # to finish — a single owner does the DDL, mirroring the `python -m db.init`
  # step and avoiding two services racing to CREATE TABLE on boot.
  db-init:
    build: .
    image: chatbot-app:latest
    command: python -m db.init
    environment:
      DATABASE_URL: postgresql+psycopg://chatbot:chatbot@db:5432/chatbot
    depends_on:
      db:
        condition: service_healthy

  ingestion:
    image: chatbot-app:latest
    build: .
    command: uvicorn ingestion.main:app --host 0.0.0.0 --port 8001
    environment:
      DATABASE_URL: postgresql+psycopg://chatbot:chatbot@db:5432/chatbot
    ports:
      - "8001:8001"
    depends_on:
      db-init:
        condition: service_completed_successfully

  # Broker consumer: reads the Redis Stream and persists logs to Postgres.
  worker:
    image: chatbot-app:latest
    build: .
    command: python -m ingestion.worker
    environment:
      DATABASE_URL: postgresql+psycopg://chatbot:chatbot@db:5432/chatbot
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  chatbot:
    image: chatbot-app:latest
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://chatbot:chatbot@db:5432/chatbot
      # Event-based transport: publish logs to Redis (the worker consumes them).
      REDIS_URL: redis://redis:6379/0
      # How calls are instrumented: "patch" (default) auto-instruments by
      # monkey-patching the provider SDK; "wrapper" uses the explicit
      # TracedClient. Both capture identical fields — this is the rollback.
      LLM_INSTRUMENTATION: ${LLM_INSTRUMENTATION:-patch}
      # Provider selection (default anthropic). For Gemini set LLM_PROVIDER=gemini
      # and GEMINI_API_KEY in .env; ANTHROPIC_API_KEY is optional then.
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
